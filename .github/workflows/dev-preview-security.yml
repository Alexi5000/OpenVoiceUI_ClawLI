name: Development preview isolation
on:
  pull_request:
    paths:
      - 'routes/canvas.py'
      - 'app.py'
      - 'src/app.js'
      - 'tests/test_dev_preview_security.py'
      - 'tests/browser/dev_preview_isolation.py'
      - '.github/workflows/dev-preview-security.yml'
  push:
    branches: [main]
    paths:
      - 'routes/canvas.py'
      - 'app.py'
      - 'src/app.js'
      - 'tests/test_dev_preview_security.py'
      - 'tests/browser/dev_preview_isolation.py'
      - '.github/workflows/dev-preview-security.yml'
permissions:
  contents: read
jobs:
  browser-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_dev_preview_security.py -q
      - run: python tests/browser/dev_preview_isolation.py
