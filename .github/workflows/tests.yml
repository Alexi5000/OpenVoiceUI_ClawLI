name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run music embed security regressions
        run: node --test tests/js/music-embed.test.mjs

      - name: Run device staging security regressions
        run: node --test tests/js/device-staging.test.cjs

      - name: Run gallery security regressions
        run: node --test tests/js/gallery-security.test.cjs

      - name: Run session ID security regressions
        run: node --test tests/js/session-id.test.mjs

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q
